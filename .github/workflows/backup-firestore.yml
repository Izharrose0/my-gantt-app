name: Backup Firestore (settimanale)

# Backup automatico settimanale + manuale on-demand. Scarica il workspace
# principale da Firestore e lo committa nel repo sotto backups/.
# Ogni venerdì alle 20:00 UTC (22:00 in Italia in estate, 21:00 in inverno).
on:
  schedule:
    - cron: '0 20 * * 5'
  workflow_dispatch: {}

permissions:
  contents: write  # serve per committare il file di backup

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: scripts/package.json

      - name: Install dependencies
        working-directory: scripts
        run: npm install --omit=dev --no-audit --no-fund

      - name: Backup Firestore
        working-directory: scripts
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node backup-firestore.mjs

      - name: Commit backup
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backups/
          if git diff --staged --quiet; then
            echo "Nessuna modifica al backup, skip commit"
          else
            git commit -m "chore(backup): snapshot Firestore $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
